name: Publish to npm

# Publishes the committed code (no regeneration) when a version tag is pushed, e.g.:
#   git tag v3.1.0 && git push origin v3.1.0
# Uses npm Trusted Publishing (OIDC): no token. One-time setup on npmjs.com:
#   package schooldigger > Settings > Trusted Publisher > GitHub Actions with
#   organization SchoolDigger, repository schooldigger-js, workflow publish.yml, environment npm.
# package.json repository.url must stay https://github.com/SchoolDigger/schooldigger-js.git.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write   # required for Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm (Trusted Publishing needs 11.5.1 or later)
        run: npm install -g npm@latest

      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1
          fi

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Publish
        run: npm publish
